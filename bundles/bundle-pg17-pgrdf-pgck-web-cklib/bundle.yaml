spec_version: 0.2
name: bundle-pg17-pgrdf-pgck-web-cklib
description: PostgreSQL 17 + pgRDF 0.5.19 + pgCK 0.2.2 + pgckweb 0.2.0 + cklib 1.3.11

# Hand-crafted bundle: thin layer on top of bundle-pg17-pgrdf-pgck with
# pgckweb (FastAPI) + cklib (CK.Lib.Js) wired in. The current generator
# (spec_version 0.1) doesn't model FROM-image composition or python venv steps,
# so this Dockerfile is maintained by hand. Re-enable rendering once the
# generator learns components: + static_web:.
skip_render: true

image:
  registry: ghcr.io/sporaxis-com/ociger-pg17-pgrdf-pgck-web-cklib
  pg_major: 17
  base_image: postgres:17-bookworm
  final_image: gcr.io/distroless/base-debian12:latest
  runtime_profile: stable

extensions:
  pgrdf:
    version: 0.5.19
    source: https://github.com/styk-tv/pgRDF
  pgck:
    version: 0.2.2
    source: https://github.com/styk-tv/pgCK

components:
  pgckweb:
    version: 0.2.0
    source: https://github.com/styk-tv/pgCK/tree/main/web_demo
    port: 8000
    description: FastAPI web UI for pgCK kernel operations
  cklib:
    version: 1.3.11
    source: https://github.com/ConceptKernel/CK.Lib.Js
    mount_path: /cklib
    description: Browser JavaScript client library for CKP v3.8 kernel dispatch + NATS WSS

static_web:
  - source_image: ghcr.io/conceptkernel/ck-lib-js:1.3.11
    route: /cklib

platforms:
  - linux/amd64
  - linux/arm64

ports:
  - name: postgres
    container_port: 5432
  - name: fastapi
    container_port: 8000

local:
  prefix: ociger-
  data_dir: .artifacts/ociger-pg17-pgrdf-pgck-web-cklib-smoke/pgdata
  network: ociger-pg17-pgrdf-pgck-web-cklib-net
  container: ociger-pg17-pgrdf-pgck-web-cklib-smoke
