# (v0.7.30) PRE-ONESHOT FALLBACK ONLY — the ck-identity oneshot OVERWRITES this
# file at every boot with the auth_callout config (issuer = the resolved account
# pubkey; anon connections become subscribe-only through the callout). Because
# the nats service depends on ck-identity, nats never actually starts on this
# file; it is retained only as a safe default if the oneshot is disabled. The
# interim forge-deny below is the fallback mitigation for that disabled case.
port: 4222
websocket {
  port: 9222
  no_tls: true
}
# Interim forge-deny fallback: every unauthenticated connection maps to the
# `anon` user (no_auth_user), which is denied publish on input.*.*.sealed so it
# cannot forge a governed *.sealed event. Superseded by the auth-callout anon
# tier (subscribe-only, no publish at all) whenever the oneshot runs.
authorization {
  users [
    { user: anon, password: anon,
      permissions: { publish: { deny: "input.kernel.pgck.action.*.sealed" } } }
  ]
}
no_auth_user: anon
