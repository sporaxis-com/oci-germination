port: 4222
websocket {
  port: 9222
  no_tls: true
}
# v0.7.29 interim mitigation (pgCK NOTIFY-RESPONSE §1): pgCK 0.4.23's fan-out
# echoes client bytes verbatim onto event.kernel.pgCK.<verb>; deny the one
# input pattern that would let a client forge a governed *.sealed event.
# Every unauthenticated connection maps to the `anon` user (no_auth_user),
# which carries deny-only permissions (all else allowed) — so the pgCK
# bridge worker (event.*) and the relay (result.*) are unaffected.
# Verbs are lowercase two-token (task.create); sealed Types are capitalised.
# 0.4.24 removes the echo; this whole block is replaced by the auth-callout
# stanza at v0.7.30 (no_auth_user is removed with it).
authorization {
  users [
    { user: anon, password: anon,
      permissions: { publish: { deny: "input.kernel.pgCK.action.*.sealed" } } }
  ]
}
no_auth_user: anon
