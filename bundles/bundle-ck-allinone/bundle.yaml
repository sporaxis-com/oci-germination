spec_version: 0.2
name: bundle-ck-allinone
description: CKP v3.8 all-in-one micro runtime — PostgreSQL 17 + pgRDF 0.5.1 + pgCK 0.1.2 + pgckweb 0.1.0 + cklib 1.2.0 + NATS 2.14.1 WSS bridge

image:
  registry: ghcr.io/sporaxis-com/ociger-ck-allinone
  pg_major: 17
  base_image: postgres:17-bookworm
  final_image: gcr.io/distroless/base-debian12:latest
  runtime_profile: micro

extensions:
  pgrdf:
    version: 0.5.1
    source: https://github.com/styk-tv/pgRDF
  pgck:
    version: 0.1.2
    source: https://github.com/styk-tv/pgCK

components:
  pgckweb:
    version: 0.1.0
    source: https://github.com/styk-tv/pgCK/tree/main/web
    port: 8000
    description: FastAPI web UI for pgCK kernel operations
  cklib:
    version: 1.2.0
    source: https://github.com/ConceptKernel/CK.Lib.Js
    mount_path: /cklib
    description: Browser JavaScript client library for CKP v3.8 kernel dispatch + NATS WSS
  nats:
    version: 2.14.1
    source: https://github.com/nats-io/nats-server
    core_port: 4222
    wss_port: 9222
    jetstream: false
    description: Message bus for kernel communication, WSS bridge for browser clients

services:
  nats:
    source_image: nats:2.14.1-scratch
    core_port: 4222
    websocket_port: 9222
    jetstream: false

static_web:
  - source_image: ghcr.io/conceptkernel/ck-lib-js:1.2.0
    route: /cklib

supervisor:
  description: Tiny Go supervisor orchestrates PostgreSQL + pgckweb FastAPI + NATS

platforms:
  - linux/amd64
  - linux/arm64

ports:
  - name: postgres
    container_port: 5432
  - name: fastapi
    container_port: 8000
  - name: nats
    container_port: 4222
  - name: nats-wss
    container_port: 9222

local:
  prefix: ociger-
  data_dir: .artifacts/ociger-ck-allinone-smoke/pgdata
  network: ociger-ck-allinone-net
  container: ociger-ck-allinone-smoke
