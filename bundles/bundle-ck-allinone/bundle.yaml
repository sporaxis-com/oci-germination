spec_version: 0.4
name: bundle-ck-allinone
version: v0.7.30
role: prod
never_prod: false
description: "CKP v3.9 Critical Isolation ENFORCED — PostgreSQL 18 (trixie, glibc 2.41) + pgRDF 0.6.20 + pgCK 0.4.24-pg18-nats + pgcrypto + NATS 2.14.2 (core+WSS) + cklib 1.5.5, supervised by s6-overlay, web served by busybox httpd. Scratch base. No Python, no postgres client. The Go ociger-pgck-relay is DELETED: pgCK 0.4.24-nats owns the in-extension inbound dispatch (F1-inbound, hop 4 — ckp.requester from the broker-enforced verified identity), the NATS auth-callout responder, and the ckp.outbox drain in-process, activated by pgck.nats_url (+ pgck.nats_account_seed for the callout)."

# Hand-crafted bundle: layers s6-overlay + busybox httpd + cklib + two
# in-tree Go binaries on top of pg18-pgrdf-pgck-nats-micro. Generator
# does not yet model FROM-image composition or s6-rc.d service trees,
# so the Dockerfile + s6-services/ tree are maintained by hand.
skip_render: true

image:
  registry: ghcr.io/sporaxis-com/ociger-ck-allinone
  pg_major: 18
  base_image: ghcr.io/sporaxis-com/ociger-pg18-pgrdf-pgck-nats-micro
  base_image_version: v0.2.1
  final_image: scratch
  runtime_profile: micro

extensions:
  pgcrypto:
    version: builtin
    source: https://www.postgresql.org/docs/18/pgcrypto.html
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgcrypto;
  pgrdf:
    version: 0.6.20
    source: https://github.com/styk-tv/pgRDF
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgrdf;
  pgck:
    version: 0.4.24
    source: https://github.com/styk-tv/pgCK
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgck CASCADE;
    contract: Critical Isolation Alpha (v3.9). CREATE EXTENSION pgck creates ck_substrate (NOLOGIN, owns ckp internals) + ck_participant (LOGIN-capable, holds only EXECUTE ckp.dispatch). External consumers connect as ck_participant; deploy MUST set OCIGER_CK_PARTICIPANT_PASSWORD before exposure.

components:
  s6-overlay:
    version: 3.2.3.0
    source: https://github.com/just-containers/s6-overlay
    description: PID 1 supervisor; s6-svscan + s6-rc compile services from /etc/s6-overlay/s6-rc.d/ at boot.
  busybox:
    version: 1.36.1
    role: httpd-applet
    source: https://hub.docker.com/_/busybox
    port: 8000
    description: Single static binary; httpd applet serves /app on :8000.
  cklib:
    version: 1.5.5
    source: https://github.com/ConceptKernel/CK.Lib.Js
    mount_path: /app/cklib
    description: Browser JavaScript client library for CKP v3.9 kernel dispatch + NATS WSS, served at /cklib/ over HTTP. v1.5.3 — the dispatch-only client, verified TYPED-SEALED live against the v0.7.17 convergence cut (the consumer half of the three-repo v3.9 loop). Ships ck.js (the L2 dispatch facade / entry point — CK/ConceptKernel/ckOn + the instance.*/kernel.* op→verb table), ck-client.js (vendored transport, grammar-agnostic result.kernel.<K>.> subscription), ck-store.js (typed-instance cache), vendor/{msgpack,nats.ws}.js. No index.html, no RDF tier, no esm.sh fetch. The smoke ⑤± gate asserts this exact attested file set (the byte-set packaging contract adopted by both sides).
  nats-server:
    version: 2.14.2
    source: https://github.com/nats-io/nats-server
    core_port: 4222
    wss_port: 9222
    jetstream: false
    description: Inherited via pg_base; supervised by s6 as a sibling longrun.
  ociger-pg-launcher:
    version: in-tree
    source: ./cmd/ociger-pg-launcher
    description: PID-stable postgres launcher; handles initdb on first boot, appends OCIGER_POSTGRES_CONF_EXTRA, and pipes OCIGER_INITDB_SQL_FILE through `postgres --single` so the image needs no postgres client.
  ociger-ck-identity:
    version: in-tree
    role: boot-provisioner
    source: ./cmd/ociger-ck-identity
    runs_as: s6 oneshot (before nats + postgres)
    description: >-
      Boot-time NATS auth-callout provisioner (v0.7.30). Resolves the callout ACCOUNT nkey — OCIGER_NATS_ACCOUNT_SEED if the operator supplied one (stable account), else minted fresh per boot — plus the pgck_worker bypass password (OCIGER_NATS_WORKER_PASSWORD or random). Writes /etc/nats/nats-server.conf (auth_callout issuer = account pubkey, pgck_worker as the sole auth_user) and /run/ck-identity/pgck.conf (pgck.nats_account_seed + worker-cred pgck.nats_url) from ONE account, so the seed pgCK signs admittance with always matches the issuer the broker verifies. postgres pulls the fragment in via include_if_exists every boot. The seed is NEVER baked into the image.
    security: >-
      The account seed is the admittance-signing secret — anyone holding it can forge verified identities. It lives only in tmpfs (/run) + process memory; per-boot ephemeral by default. Operators wanting a stable account set OCIGER_NATS_ACCOUNT_SEED (delivered like the OIDC config); it is honored verbatim.

  # (v0.7.30) ociger-pgck-relay REMOVED. pgCK 0.4.24-nats owns the inbound
  # dispatch in-.so (F1-inbound, hop 4: ckp.requester from the broker-enforced
  # verified identity), the auth-callout responder, and the ckp.outbox drain —
  # so the Go bridge is deleted (keeping it would double-dispatch).

supervisor:
  binary: s6-overlay v3.2.3.0
  description: s6-svscan PID 1 runs the ck-identity oneshot FIRST (provisions the auth-callout account → nats-server.conf + /run/ck-identity/pgck.conf), then supervises postgres + nats + httpd as longruns (both depend on ck-identity). The pgCK 0.4.24-nats .so owns the inbound dispatch, the auth-callout responder, and the ckp.outbox drain in-process (no Go relay). Bootstrap SQL runs in `postgres --single` inside the launcher on first boot.

platforms:
  - linux/amd64
  - linux/arm64

ports:
  - name: postgres
    container_port: 5432
  - name: http
    container_port: 8000
  - name: nats
    container_port: 4222
  - name: nats-wss
    container_port: 9222

local:
  prefix: ociger-
  data_dir: .artifacts/ociger-ck-allinone-smoke/pgdata
  network: ociger-ck-allinone-net
  container: ociger-ck-allinone-smoke
