spec_version: 0.4
name: bundle-ck-allinone
role: prod
never_prod: false
description: CKP v3.8 all-in-one minimal — PostgreSQL 17 + pgRDF 0.5.28 + pgCK 0.2.2 + NATS 2.14.1 (core+WSS) + cklib 1.3.11, supervised by s6-overlay, web served by busybox httpd. Scratch base, no Python, no FastAPI. Marketplace-minimal.

# Hand-crafted bundle: layers s6-overlay + busybox httpd + cklib on top of
# pg17-pgrdf-pgck-nats-micro (scratch + selectively-copied bookworm libs).
# Generator does not model FROM-image composition or s6-rc.d service trees,
# so the Dockerfile + s6-services/ tree are maintained by hand.
skip_render: true

image:
  registry: ghcr.io/sporaxis-com/ociger-ck-allinone
  pg_major: 17
  base_image: ghcr.io/sporaxis-com/ociger-pg17-pgrdf-pgck-nats-micro
  final_image: scratch
  runtime_profile: micro

extensions:
  pgrdf:
    version: 0.5.28
    source: https://github.com/styk-tv/pgRDF
  pgck:
    version: 0.2.2
    source: https://github.com/styk-tv/pgCK

components:
  s6-overlay:
    version: 3.2.3.0
    source: https://github.com/just-containers/s6-overlay
    description: Modern init + service supervisor for the container; replaces the previous bespoke ociger-supervisor
  busybox:
    version: 1.36.1
    role: httpd-applet  # per SPEC.OCI.BUNDLE.v0.4 §1.4.3 + §9.1
    source: https://hub.docker.com/_/busybox (musl variant)
    port: 8000
    description: Static binary; httpd applet serves /app on :8000 (replaces the previous bespoke ociger-static-server and the prior FastAPI/uvicorn stand-in)
  cklib:
    version: 1.3.11
    source: https://github.com/ConceptKernel/CK.Lib.Js
    mount_path: /app/cklib
    description: Browser JavaScript client library for CKP v3.8 kernel dispatch + NATS WSS, served at /cklib/ over HTTP
  nats:
    version: 2.14.1
    source: https://github.com/nats-io/nats-server
    core_port: 4222
    wss_port: 9222
    jetstream: false
    description: Inherited via pg_base; supervised by s6 as a sibling longrun

services:
  nats:
    source_image: nats:2.14.1-scratch
    core_port: 4222
    websocket_port: 9222
    jetstream: false

supervisor:
  binary: s6-overlay v3.2.3.0
  description: s6-svscan PID 1 supervises postgres + nats + busybox-httpd as s6-rc longruns

platforms:
  - linux/amd64
  - linux/arm64

ports:
  - name: postgres
    container_port: 5432
  - name: http
    container_port: 8000
  - name: nats
    container_port: 4222
  - name: nats-wss
    container_port: 9222

local:
  prefix: ociger-
  data_dir: .artifacts/ociger-ck-allinone-smoke/pgdata
  network: ociger-ck-allinone-net
  container: ociger-ck-allinone-smoke
