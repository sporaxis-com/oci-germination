spec_version: 0.4
name: bundle-ck-allinone
version: v0.7.12
role: prod
never_prod: false
description: "CKP v3.9 Critical Isolation ENFORCED + dispatch-bridge relay — PostgreSQL 17 + pgRDF 0.5.43 + pgCK 0.4.1 (CI-A role floor + CI-B sealed registry + CI-C plan compiler + CI-D governance plane + CI-E typed reads — all five tracks shipped) + pgcrypto + NATS 2.14.1 (core+WSS) + cklib 1.4.2 (Air-gapped cut), supervised by s6-overlay, web served by busybox httpd. Scratch base. No Python. No postgres client (bootstrap via `postgres --single`). v0.7.11+ carries the dispatch-bridge relay — subscribe input.kernel.<K>.action.<verb>, CALL ckp.dispatch(verb, kernel_urn, payload, identity) over TCP+scram as ck_participant, publish typed reply on result.kernel.<K>.<verb> preserving inbound headers. The bundle bakes the ck_substrate/ck_participant role floor automatically via CREATE EXTENSION pgck; external consumers (web2/) MUST connect as ck_participant with a deploy-supplied password (OCIGER_CK_PARTICIPANT_PASSWORD env)."

# Hand-crafted bundle: layers s6-overlay + busybox httpd + cklib + two
# in-tree Go binaries on top of pg17-pgrdf-pgck-nats-micro. Generator
# does not yet model FROM-image composition or s6-rc.d service trees,
# so the Dockerfile + s6-services/ tree are maintained by hand.
skip_render: true

image:
  registry: ghcr.io/sporaxis-com/ociger-ck-allinone
  pg_major: 17
  base_image: ghcr.io/sporaxis-com/ociger-pg17-pgrdf-pgck-nats-micro
  base_image_version: v0.1.7
  final_image: scratch
  runtime_profile: micro

extensions:
  pgcrypto:
    version: builtin
    source: https://www.postgresql.org/docs/17/pgcrypto.html
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgcrypto;
  pgrdf:
    version: 0.5.43
    source: https://github.com/styk-tv/pgRDF
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgrdf;
  pgck:
    version: 0.4.1
    source: https://github.com/styk-tv/pgCK
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgck CASCADE;
    contract: Critical Isolation Alpha (v3.9). CREATE EXTENSION pgck creates ck_substrate (NOLOGIN, owns ckp internals) + ck_participant (LOGIN-capable, holds only EXECUTE ckp.dispatch). External consumers connect as ck_participant; deploy MUST set OCIGER_CK_PARTICIPANT_PASSWORD before exposure.

components:
  s6-overlay:
    version: 3.2.3.0
    source: https://github.com/just-containers/s6-overlay
    description: PID 1 supervisor; s6-svscan + s6-rc compile services from /etc/s6-overlay/s6-rc.d/ at boot.
  busybox:
    version: 1.36.1
    role: httpd-applet
    source: https://hub.docker.com/_/busybox
    port: 8000
    description: Single static binary; httpd applet serves /app on :8000.
  cklib:
    version: 1.4.2
    source: https://github.com/ConceptKernel/CK.Lib.Js
    mount_path: /app/cklib
    description: Browser JavaScript client library for CKP v3.8 kernel dispatch + NATS WSS, served at /cklib/ over HTTP. v1.4.2 "Air-gapped" — requested explicitly by CK.Lib.Js for the bundled all-in-one (SLSA-attested 2026-06-10 22:27 UTC). OCI bundle file set is byte-identical to 1.4.1 and 1.4.0 (verified empirically); the vendoring claim applies to the npm package, not the OCI bundle. File-level RDF surface excise + L2 facade remain forward work on the v1.5.0 line.
  nats-server:
    version: 2.14.1
    source: https://github.com/nats-io/nats-server
    core_port: 4222
    wss_port: 9222
    jetstream: false
    description: Inherited via pg_base; supervised by s6 as a sibling longrun.
  ociger-pg-launcher:
    version: in-tree
    source: ./cmd/ociger-pg-launcher
    description: PID-stable postgres launcher; handles initdb on first boot, appends OCIGER_POSTGRES_CONF_EXTRA, and pipes OCIGER_INITDB_SQL_FILE through `postgres --single` so the image needs no postgres client.
  ociger-pgck-relay:
    version: in-tree (v0.7.11 generation — dispatch bridge)
    role: bridge
    source: ./cmd/ociger-pgck-relay
    shims_for: pgck@0.4.x (nats-client Cargo feature OFF through Track D; not a v0.4.0 gate)
    notify_ref: pgck/publish-nats-client-feature-build
    retire_probe: pgck.so contains BOTH 'RELAY_OUT_PREFIX' AND 'async_nats::' (multi-marker conjunction; ratified with pgCK upstream 2026-06-10)
    opt_out_env: OCIGER_DISABLE_PGCK_RELAY=1
    description: NATS → pgCK dispatch bridge. Subscribes input.kernel.<K>.action.<verb>; connects to postgres as ck_participant over Unix socket; calls ckp.dispatch(verb, kernel_urn, payload::jsonb, identity); publishes typed jsonb reply on result.kernel.<K>.<verb> preserving inbound headers (incl. Trace-Id, X-Identity-Key). Replaces the v0.7.5–v0.7.10 bus-level echo per CK.Lib.Js NOTIFY v0.7.9.integration-gaps-block-v150.

supervisor:
  binary: s6-overlay v3.2.3.0
  description: s6-svscan PID 1 supervises postgres + nats + httpd + pgck-relay as longruns. Bootstrap SQL runs in `postgres --single` inside the launcher on first boot; no oneshot service is required.

platforms:
  - linux/amd64
  - linux/arm64

ports:
  - name: postgres
    container_port: 5432
  - name: http
    container_port: 8000
  - name: nats
    container_port: 4222
  - name: nats-wss
    container_port: 9222

local:
  prefix: ociger-
  data_dir: .artifacts/ociger-ck-allinone-smoke/pgdata
  network: ociger-ck-allinone-net
  container: ociger-ck-allinone-smoke
