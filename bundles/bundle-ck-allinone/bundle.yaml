spec_version: 0.4
name: bundle-ck-allinone
version: v0.7.32
role: prod
never_prod: false
description: "CKP v3.9 Critical Isolation ENFORCED — PostgreSQL 18 (trixie, glibc 2.41) + pgRDF 0.6.20 + pgCK 0.4.24-pg18-nats + pgcrypto + NATS 2.14.2 (core+WSS) + cklib 1.5.5, supervised by s6-overlay, web served by busybox httpd. Scratch base. No Python, no postgres client. The Go ociger-pgck-relay is DELETED: pgCK 0.4.24-nats owns the in-extension inbound dispatch (F1-inbound, hop 4 — ckp.requester from the broker-enforced verified identity), the NATS auth-callout responder, and the ckp.outbox drain in-process, activated by pgck.nats_url (+ pgck.nats_account_seed for the callout)."

# Hand-crafted bundle: layers s6-overlay + busybox httpd + cklib + two
# in-tree Go binaries on top of pg18-pgrdf-pgck-nats-micro. Generator
# does not yet model FROM-image composition or s6-rc.d service trees,
# so the Dockerfile + s6-services/ tree are maintained by hand.
skip_render: true

image:
  registry: ghcr.io/sporaxis-com/ociger-ck-allinone
  pg_major: 18
  base_image: ghcr.io/sporaxis-com/ociger-pg18-pgrdf-pgck-nats-micro
  base_image_version: v0.2.9
  final_image: scratch
  runtime_profile: micro

extensions:
  pgcrypto:
    version: builtin
    source: https://www.postgresql.org/docs/18/pgcrypto.html
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgcrypto;
  pgrdf:
    version: 0.6.34
    source: https://github.com/styk-tv/pgRDF
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgrdf;
  pgck:
    version: 0.4.82
    source: https://github.com/styk-tv/pgCK
    bootstrap: CREATE EXTENSION IF NOT EXISTS pgck CASCADE;
    contract: Critical Isolation Alpha (v3.9). CREATE EXTENSION pgck creates ck_substrate (NOLOGIN, owns ckp internals) + ck_participant (LOGIN-capable, holds only EXECUTE ckp.dispatch). External consumers connect as ck_participant; deploy MUST set OCIGER_CK_PARTICIPANT_PASSWORD before exposure.

components:
  s6-overlay:
    version: 3.2.3.0
    source: https://github.com/just-containers/s6-overlay
    description: PID 1 supervisor; s6-svscan + s6-rc compile services from /etc/s6-overlay/s6-rc.d/ at boot.
  busybox:
    version: 1.36.1
    role: httpd-applet
    source: https://hub.docker.com/_/busybox
    port: 8000
    description: Single static binary; httpd applet serves /app on :8000.
  cklib:
    version: 1.5.13
    source: https://github.com/ConceptKernel/CK.Lib.Js
    mount_path: /app/cklib
    description: Browser JavaScript client library for CKP v3.9 kernel dispatch + NATS WSS, served at /cklib/ over HTTP. v1.5.3 — the dispatch-only client, verified TYPED-SEALED live against the v0.7.17 convergence cut (the consumer half of the three-repo v3.9 loop). Ships ck.js (the L2 dispatch facade / entry point — CK/ConceptKernel/ckOn + the instance.*/kernel.* op→verb table), ck-client.js (vendored transport, grammar-agnostic result.kernel.<K>.> subscription), ck-store.js (typed-instance cache), vendor/{msgpack,nats.ws}.js. No index.html, no RDF tier, no esm.sh fetch. The smoke ⑤± gate asserts this exact attested file set (the byte-set packaging contract adopted by both sides).
  nats-server:
    version: 2.14.2
    source: https://github.com/nats-io/nats-server
    core_port: 4222
    wss_port: 9222
    jetstream: false
    description: Inherited via pg_base; supervised by s6 as a sibling longrun.
  ociger-pg-launcher:
    version: in-tree
    source: ./cmd/ociger-pg-launcher
    description: PID-stable postgres launcher; handles initdb on first boot, appends OCIGER_POSTGRES_CONF_EXTRA, and pipes OCIGER_INITDB_SQL_FILE through `postgres --single` so the image needs no postgres client.
  ociger-ck-identity:
    version: in-tree
    role: boot-provisioner
    source: ./cmd/ociger-ck-identity
    runs_as: s6 oneshot (before nats + postgres)
    description: >-
      Boot-time NATS auth-callout provisioner (v0.7.30), GATED on an OIDC realm. When OCIGER_OIDC_JWKS + OCIGER_OIDC_ISSUER + OCIGER_OIDC_AUDIENCE are supplied it activates the callout: resolves the callout ACCOUNT nkey (OCIGER_NATS_ACCOUNT_SEED if supplied → stable, else minted per boot) + the pgck_worker bypass password, then writes /etc/nats/nats-server.conf (auth_callout issuer = account pubkey, pgck_worker the sole auth_user) and /run/ck-identity/pgck.conf (pgck.nats_account_seed + worker-cred pgck.nats_url + pgck.oidc_*) from ONE account, so the seed pgCK signs admittance with always matches the issuer the broker verifies. With no realm it writes an anonymous config (no callout, no seed → pgCK responder not started), so adopters without an IdP still dispatch. postgres pulls the fragment via include_if_exists; v0.7.31 hardening writes pgck.conf 0640 and chowns it to postgres(999) so the dropped-to-non-root nats/httpd services cannot read the seed. The seed is NEVER baked into the image.
    security: >-
      The account seed is the admittance-signing secret — anyone holding it can forge verified identities. It lives only in tmpfs (/run) + process memory; per-boot ephemeral by default. Operators wanting a stable account set OCIGER_NATS_ACCOUNT_SEED (delivered like the OIDC config); it is honored verbatim.

  # (v0.7.30) ociger-pgck-relay REMOVED. pgCK 0.4.24-nats owns the inbound
  # dispatch in-.so (F1-inbound, hop 4: ckp.requester from the broker-enforced
  # verified identity), the auth-callout responder, and the ckp.outbox drain —
  # so the Go bridge is deleted (keeping it would double-dispatch).

runtime_inputs:
  # Declared, typed inputs the operator delivers AT CONTAINER START. Nothing here
  # is baked into the image, and nothing here is fetched by the container: this
  # bundle performs no egress at boot. The generator validates this block; the
  # smoke gate asserts the resulting GUC. See SPEC.OCI.BUNDLE §runtime_inputs.
  oidc_jwks:
    required: false            # absent → anonymous tier; the bundle still boots
    form: document             # the JSON itself, NEVER a URL
    media_type: application/jwk-set+json
    delivery: [file, env]      # OCIGER_OIDC_JWKS_FILE (preferred) | OCIGER_OIDC_JWKS
    env: OCIGER_OIDC_JWKS
    file_env: OCIGER_OIDC_JWKS_FILE
    consumed_by: ociger-ck-identity
    placed_at: /run/ck-identity/pgck.conf   # as pgck.oidc_jwks, 0640, owned by postgres
    never_baked: true
    no_egress: true
    description: >-
      The realm's JWKS DOCUMENT. pgCK verifies bearers in-memory with no egress in
      the live path, so a URL can never verify anything — it leaves token verify off
      and every connection in the anonymous tier (og#29). ociger-ck-identity refuses a
      URL by name, and on any failure OMITS pgck.oidc_jwks entirely rather than writing
      a value that cannot verify: an absent GUC degrades to anonymous-but-alive, while
      an unusable one combined with strict admittance would refuse every connection.
    gate: >-
      SELECT current_setting('pgck.oidc_jwks') begins with '{' and parses as a JWKS
      carrying at least one kty:OKP / crv:Ed25519 key; the boot log reads
      "token verify: ON". ">=1 key" is NOT sufficient and this gate said so until
      2026-08-17: pgCK's auth-callout verifies EdDSA only and keeps solely
      OKP/Ed25519, so an RSA-only realm (e.g. Azure Entra, RS256) satisfied the old
      wording, wrote the GUC, logged verify ON, and left every connection anonymous.
      Negatives, each of which must leave the container ALIVE with the GUC absent and
      the refusal named in the log: (a) deliver a URL, (b) deliver an RSA-only or
      EC-only key set, (c) deliver kty:OKP with a curve other than Ed25519.
      A mixed set carrying one Ed25519 key MUST be accepted — the bench realm ships
      EdDSA + RS256 + RSA-OAEP, so rejecting the extras would be wrong.
  oidc_issuer:
    required: false
    form: scalar
    env: OCIGER_OIDC_ISSUER
    consumed_by: ociger-ck-identity
    never_baked: true
  oidc_audience:
    required: false
    form: scalar
    env: OCIGER_OIDC_AUDIENCE
    consumed_by: ociger-ck-identity
    never_baked: true
  nats_account_seed:
    required: false            # absent → minted per boot (ephemeral, single-instance)
    form: scalar
    env: OCIGER_NATS_ACCOUNT_SEED
    consumed_by: ociger-ck-identity
    placed_at: /run/ck-identity/pgck.conf
    never_baked: true
    secret: true
    description: >-
      The admittance-signing account nkey seed. Holding it is authority to forge
      verified identities, so it lives only in tmpfs and process memory. Supply it to
      pin a stable issuer across boots or across replicas; omit it and each boot mints
      its own, which is correct for a single instance and wrong for two.
  ck_participant_password:
    required: false            # absent → the role exists but cannot log in
    form: scalar
    env: OCIGER_CK_PARTICIPANT_PASSWORD
    consumed_by: ociger-pg-launcher
    never_baked: true
    secret: true
    description: >-
      SCRAM password for ck_participant, the only externally-exposed role. MUST be set
      before exposing the instance; without it the v3.9 role floor is present but the
      role cannot authenticate.

supervisor:
  binary: s6-overlay v3.2.3.0
  description: >-
    s6-svscan PID 1 (root — s6-overlay init) runs the ck-identity oneshot FIRST (provisions the auth-callout account → nats-server.conf + /run/ck-identity/pgck.conf), then supervises postgres (drops to uid 999), nats (v0.7.31 hardening drops to non-root `nats` via s6-setuidgid), and httpd (drops to non-root `httpd`) as longruns (both depend on ck-identity). No exposed longrun runs as root; smoke ⑧ enforces it. The pgCK 0.4.24-nats .so owns the inbound dispatch, the auth-callout responder, and the ckp.outbox drain in-process (no Go relay). Bootstrap SQL runs in `postgres --single` inside the launcher on first boot.

platforms:
  - linux/amd64
  - linux/arm64

ports:
  - name: postgres
    container_port: 5432
  - name: http
    container_port: 8000
  - name: nats
    container_port: 4222
  - name: nats-wss
    container_port: 9222

local:
  prefix: ociger-
  data_dir: .artifacts/ociger-ck-allinone-smoke/pgdata
  network: ociger-ck-allinone-net
  container: ociger-ck-allinone-smoke
