spec_version: 0.4
name: core-pg17-nats-micro
role: prod
never_prod: false
description: Minimal PostgreSQL 17 micro runtime with colocated NATS core and websocket listeners
image:
  registry: ghcr.io/sporaxis-com/ociger-core-pg17-nats-micro
  pg_major: 17
  base_image: postgres:17-bookworm
  final_image: scratch
  runtime_profile: micro
platforms:
  - linux/amd64
  - linux/arm64
ports:
  - name: postgres
    container_port: 5432
  - name: nats
    container_port: 4222
  - name: nats-ws
    container_port: 9222
services:
  nats:
    source_image: nats:2.14.1-scratch
    core_port: 4222
    websocket_port: 9222
    jetstream: false
local:
  prefix: ociger-
  data_dir: .artifacts/ociger-core-pg17-nats-micro-smoke/pgdata
  network: ociger-core-pg17-nats-micro-net
  container: ociger-core-pg17-nats-micro-smoke
