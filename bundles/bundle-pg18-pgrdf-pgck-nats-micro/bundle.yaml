spec_version: 0.4
name: bundle-pg18-pgrdf-pgck-nats-micro
role: prod
never_prod: false
description: PostgreSQL 18 (trixie) micro runtime with pgRDF, pgCK, and colocated NATS core and websocket listeners

# Hand-crafted Dockerfile: pgRDF consumed as an ORAS-pulled artifact.
# Generator currently only emits the older curl-from-GH-releases pattern;
# disable rendering until the generator learns extracted_sources.
skip_render: true

image:
  registry: ghcr.io/sporaxis-com/ociger-pg18-pgrdf-pgck-nats-micro
  pg_major: 18
  # The postgres binaries/share are COPYed from this stage (Dockerfile
  # `FROM postgres:18-trixie AS postgres_source`); the shipped image is scratch.
  # These four lines read as authoritative and were bound to nothing until the
  # strict loader landed — they declared pg17/bookworm for a pg18/trixie build.
  base_image: postgres:18-trixie
  final_image: scratch
  runtime_profile: micro
extensions:
  pgrdf:
    version: 0.6.34
  pgck:
    version: 0.4.109
platforms:
  - linux/amd64
  - linux/arm64
ports:
  - name: postgres
    container_port: 5432
  - name: nats
    container_port: 4222
  - name: nats-ws
    container_port: 9222
services:
  nats:
    source_image: nats:2.14.2-scratch
    core_port: 4222
    websocket_port: 9222
    jetstream: false
local:
  prefix: ociger-
  data_dir: .artifacts/ociger-pg18-pgrdf-pgck-nats-micro-smoke/pgdata
  network: ociger-pg18-pgrdf-pgck-nats-micro-net
  container: ociger-pg18-pgrdf-pgck-nats-micro-smoke
