spec_version: 0.4
name: bundle-pg17-pgrdf
role: prod
never_prod: false
description: PostgreSQL 17 with pgRDF installed from upstream release artifacts

# Hand-crafted Dockerfile: consumes pgRDF as an ORAS-pulled artifact.
# The generator currently only knows how to emit the older curl-from-
# GH-releases pattern, so disable rendering until the generator learns
# extracted_sources.
skip_render: true

image:
  registry: ghcr.io/sporaxis-com/ociger-pg17-pgrdf
  pg_major: 17
  base_image: postgres:17-bookworm
  final_image: gcr.io/distroless/base-debian12:latest
extensions:
  pgrdf:
    version: 0.6.19
platforms:
  - linux/amd64
  - linux/arm64
local:
  prefix: ociger-
  data_dir: .artifacts/ociger-pg17-pgrdf-smoke/pgdata
  network: ociger-pg17-pgrdf-net
  container: ociger-pg17-pgrdf-smoke
