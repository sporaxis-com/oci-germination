# versions.yaml — the SINGLE SOURCE OF TRUTH for component versions across
# every bundle in this repo.
#
# The problem this solves: each bundle's Dockerfile / bundle.yaml / smoke
# script used to hardcode its own pgRDF / pgCK / cklib pin independently, so
# the matrix drifted — ck-allinone tracked the latest while sibling bundles
# rotted months behind on the same component. There was no one place that
# said "pgRDF is X.Y.Z", so a bump meant hunting N Dockerfiles and usually
# only touching the flagship.
#
# Now: this file is authoritative. To bump a component:
#   1. edit the version here,
#   2. run  scripts/check-versions.sh   to see which bundles drift,
#   3. update those bundles' Dockerfile + bundle.yaml + smoke pins to match,
#   4. rebuild + re-tag each (per-bundle tags — see PROVENANCE.md).
# CI runs check-versions.sh as a gate: a Dockerfile pin that disagrees with
# this file fails the build (unless the bundle is listed under `frozen:`).
#
# "latest consumable" means: published + pullable + SLSA-attested on GHCR.
# A version in an upstream CHANGELOG that has no tag/artifact yet is NOT
# consumable and MUST NOT be pinned (PROVENANCE.md rule 7).

components:
  # Latest consumable upstream pins (verified pullable + attested 2026-06-13).
  pgrdf:      "0.6.3"          # attested head; 0.6.2 shipped the parallel bulk loader. 0.6.4 is a tag with no published artifact yet (404).
  pgck:       "0.4.13"         # latest published release (styk-tv/pgck); install-from-zero. 0.4.14/0.4.15 not released (404).
  pgck_native: "pgck 0.4.3 (rc3)"  # ACTUAL string pgck_version() reports at 0.4.13 — STALE upstream (should report 0.4.13; the extension default_version/extversion/SQL are correctly 0.4.13). pgCK NOTIFY filed. Smokes pin to this; bump the moment pgCK fixes pgck_version().
  cklib:      "1.5.0"          # dispatch-only client (ck.js + ck-store.js); latest published release.
  nats:       "2.14.1"
  postgres:   "17-bookworm"
  s6_overlay: "3.2.3.0"
  busybox:    "1.36.1-musl"

bases:
  # In-repo base images other bundles derive FROM. These move when their own
  # components bump; keep them at the head their Dockerfiles consume.
  pg17-pgrdf-pgck-nats-micro: "v0.1.13"   # the ck-allinone base (pgRDF 0.6.3 + pgCK 0.4.13)

# Bundles intentionally NOT held to the canonical component pins (and why).
# check-versions.sh skips drift-failure for these; they still appear in the
# report so the freeze stays visible, not forgotten.
frozen:
  pgck-bench: "Python/FastAPI benchmark sibling on its own pgck-web cadence; re-cut deliberately, not in the component wave."
  pg17-pgrdf-pgck-static-cklib: "ck-allinone sibling (Go static server). Bringing it current needs the full v0.7.18-era scaffolding (base v0.1.12 + pgCK 0.4.2 install-from-zero init.sql + the outbox drain + cklib 1.5.0 byte-set), not a pin bump — a coordinated re-cut, tracked separately. Until then use ck-allinone."
