# versions.yaml — the SINGLE SOURCE OF TRUTH for component versions across
# every bundle in this repo.
#
# The problem this solves: each bundle's Dockerfile / bundle.yaml / smoke
# script used to hardcode its own pgRDF / pgCK / cklib pin independently, so
# the matrix drifted — ck-allinone tracked the latest while sibling bundles
# rotted months behind on the same component. There was no one place that
# said "pgRDF is X.Y.Z", so a bump meant hunting N Dockerfiles and usually
# only touching the flagship.
#
# Now: this file is authoritative. To bump a component:
#   1. edit the version here,
#   2. run  scripts/check-versions.sh   to see which bundles drift,
#   3. update those bundles' Dockerfile + bundle.yaml + smoke pins to match,
#   4. rebuild + re-tag each (per-bundle tags — see PROVENANCE.md).
# CI runs check-versions.sh as a gate: a Dockerfile pin that disagrees with
# this file fails the build (unless the bundle is listed under `frozen:`).
#
# "latest consumable" means: published + pullable + SLSA-attested on GHCR.
# A version in an upstream CHANGELOG that has no tag/artifact yet is NOT
# consumable and MUST NOT be pinned (PROVENANCE.md rule 7).

components:
  # Latest consumable upstream pins. Each verified pullable at the EXACT oras tag
  # the Dockerfiles consume, both arches, 2026-08-16 (GHCR manifest HTTP 200 for
  # pgck:<v>-pg18-nats-{amd64,arm64} and pgrdf-bundle:<v>-pg18-{amd64,arm64}).
  pgrdf:      "0.6.34"         # published 2026-08-26 (styk-tv/pgRDF v0.6.34) — the vacuity-refusal release (a validation against an empty/unseeded graph now REFUSES instead of returning conforms:true; it root-caused pgck#134 as a consumer defect). gh attestation verify exit 0 both arches (pgrdf-bundle:0.6.34-pg18-{amd64,arm64}), 2026-08-26. Unchanged by this bump.
  pgck:       "0.4.112"        # published 2026-09-04 (styk-tv/pgck v0.4.112) — ships the substrate half of the four-rung digest-validation ladder (the PRE/AT rungs), which cklib 1.6.5 is written against; 0.4.111 before it added the ORPHANED flag to fleet.adoptions (an Adoption whose intoProject names a graphless project — previously reported malformed:false, calling a broken install healthy). Reports, never gates: a seal-time refusal would turn a silent orphan into a hard boot failure on every deployment that names a project. ONTOLOGY BYTE-STABLE: all seven TTLs identical to 0.4.109/0.4.111, re-measured both arches 2026-09-05. gh attestation verify exit 0 both arches.
  pgck_native: "pgck 0.4.112"  # pgck_version() derives from CARGO_PKG_VERSION (RESOLVED in 0.4.15). Self-report == extversion.
  cklib:      "1.6.5"          # published 2026-09-04 (ConceptKernel/CK.Lib.Js v1.6.5) — "the ladder release": the client rung of the digest-validation ladder, DERIVE NEVER TRANSCRIBE, so a wrong digest cannot leave the seat. Built against SPEC.CK-DOOR.v1.6.5 §14 (R-34..R-39) and pgCK PASS-15/16 — paired with pgCK 0.4.112, whose PRE/AT rungs it relies on; do not ship this client against an older substrate. 14 suites, 361 passed / 0 failed, RED-first, and no test in the release types a digest — every one is read off the door in the same run. gh attestation verify exit 0; ck.js self-reports VERSION 1.6.5 (75,619 B, up from 54,229); SAME six-file set as 1.6.1/1.6.3/1.6.4, so the smoke byte-set list is unchanged — re-measured 2026-09-05.
  nats:       "2.14.2"
  postgres:   "18-trixie"
  s6_overlay: "3.2.3.0"
  busybox:    "1.36.1-musl"

modules:
  # sha256 of the ontology module TTLs the pgck artifact ships at
  # /ontology/v3.11/modules/ — the sourceDigest each governed Adoption in
  # ck-allinone's init.sql seals, and the value the smoke pin-ledger gate
  # COMPARES against what actually sealed (a pin is consulted or it is
  # decorative). Measured from pgck:0.4.77-pg18-nats-{amd64,arm64} on
  # 2026-08-20 and RE-MEASURED unchanged on 0.4.78, 0.4.80 and 0.4.81; byte-identical across arches.
  # Re-measure on every pgck bump —
  # a byte digest is per-artifact, never carried forward.
  wave_sha256:    "f4ad27cec4417e2ed5b566adb7f7ee200b3c3fbfddf25adf840d267fd57e417b"
  lexicon_sha256: "5def86bacfe3d2a8a6a85e9c81f8f9d77c3cfeee72509a360b2b00433d3cf21c"   # CHANGED by pgck 0.4.87 (was ce9f20f4… through 0.4.82). Load-bearing: init.sql seals an Adoption citing these bytes.
  recon_sha256:   "b2b11f1b76e22f7bfac10be3eba7b5104ff0d5d0a1d92147ec3dc392f1475d7d"   # NEW in 0.4.82's v3.11 tree; measured 2026-08-26, byte-identical across arches.
  # v3.12 FINAL tree (0.4.82; boot's default root). No lexicon module in v3.12.
  v312_core_sha256:  "2e90a6512c7aae567714be69b92b37af4393e8da8d65a05c047c5d51e1bed07b"   # CHANGED by pgck 0.4.109 (was 97f97cb2… in 0.4.88, 7de02b35… through 0.4.87). Measured 2026-09-02 via oras pull, byte-identical across arches.
  v312_wave_sha256:  "ad887db28c6e0ea04c7cbd835c40dc5441f073be988475a9634c76e9131db727"
  v312_recon_sha256: "6a7c199e7ad19580b5e975624d15a9d4823e20dee9946cd20600b04c509100ea"
  core_sha256:    "e5f7d1e54b32fa0ba2d41ba248e0909b96ee1ebb4344e2d9e9ccdf4e0b25348d"   # the v3.11 root; equals the root digest wave-v3.12's Statement names for v3.11 targets.

bases:
  # In-repo base images other bundles derive FROM. These move when their own
  # components bump; keep them at the head their Dockerfiles consume.
  pg18-pgrdf-pgck-nats-micro: "v0.2.13"  # the ck-allinone base (pg18/trixie + pgRDF 0.6.34 + pgCK 0.4.112-nats). v0.2.13 = 0.4.112 (digest-ladder PRE/AT rungs; 0.4.111 added the fleet.adoptions orphaned flag; ontology byte-stable vs 0.4.109). v0.2.12 = 0.4.109 ledger-closing wave. v0.2.11 = 0.4.88. v0.2.10 = 0.4.87. v0.2.9 = 0.6.34/0.4.82 (v3.12 FINAL). v0.2.8 = 0.4.81. v0.2.7 = 0.4.79/0.4.80. v0.2.6 = 0.4.78. v0.2.5 = 0.6.33/0.4.77. v0.2.4 = 0.6.32/0.4.76; v0.2.3 never cut.

# Bundles intentionally NOT held to the canonical component pins (and why).
# check-versions.sh skips drift-failure for these; they still appear in the
# report so the freeze stays visible, not forgotten.
frozen:
  pg17-bookworm-pgrdf: "RETIRED at the pg18 move — pgRDF is pg18-only from v0.6.20; no pg17 artifact exists to pin. Retire or re-cut on pg18 (og#9)."
  pg17-pgrdf: "RETIRED at the pg18 move — pgRDF pg18-only from v0.6.20 (og#9)."
  pg17-pgrdf-pgck: "RETIRED at the pg18 move — pgRDF/pgCK are both pg18-only; pg17 artifacts are no longer built upstream (og#9)."
  pg17-pgrdf-pgck-nats: "RETIRED at the pg18 move — pgRDF/pgCK pg18-only (og#9)."
  pgck-bench: "Python/FastAPI benchmark sibling on its own pgck-web cadence; re-cut deliberately, not in the component wave."
  pg17-pgrdf-pgck-static-cklib: "ck-allinone sibling (Go static server). Bringing it current needs the full v0.7.18-era scaffolding (base v0.1.12 + pgCK 0.4.2 install-from-zero init.sql + the outbox drain + cklib 1.5.0 byte-set), not a pin bump — a coordinated re-cut, tracked separately. Until then use ck-allinone."
