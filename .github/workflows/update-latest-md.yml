name: update-latest-md

# Refresh LATEST.md from GHCR — but ONLY after SLSA Build Provenance v1
# attestations verify against the digests we're about to publish. This is
# the policy gate from PROVENANCE.md Rule 2: if `gh attestation verify`
# doesn't find a workflow-issued attestation, this workflow exits non-zero
# and LATEST.md stays where it was.

on:
  workflow_run:
    workflows:
      - Build OCI Bundles
      - core-pg17-release
      - core-pg17-micro-release
      - core-pg17-nats-release
      - core-pg17-nats-micro-release
      - pg17-pgrdf-release
      - pg17-pgrdf-pgck-release
      - pg17-pgrdf-pgck-nats-release
      - pg17-pgrdf-pgck-nats-micro-release
    types:
      - completed
  # Manual re-trigger for recovery — e.g. when a push race (below) loses, or
  # an operator wants to force a re-render after registry-side changes.
  workflow_dispatch:

permissions:
  contents: write        # commit refreshed LATEST.md back to main
  packages: read         # read GHCR package versions
  attestations: read     # gh attestation verify

concurrency:
  group: update-latest-md
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Render LATEST.md (verify-then-render)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/render-latest-md.py > LATEST.md.new
          mv LATEST.md.new LATEST.md

      - name: Commit refresh if changed
        run: |
          set -euo pipefail
          if git diff --quiet LATEST.md; then
            echo "LATEST.md already current — nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST.md
          git commit -m "$(cat <<'EOF'
          docs(auto): refresh LATEST.md from GHCR (attestation-gated)

          Generated by .github/workflows/update-latest-md.yml after an upstream
          release workflow reported success AND after SLSA Build Provenance v1
          attestations verified via 'gh attestation verify' for every digest
          this file advertises. Do not edit by hand — manual edits are reverted
          on the next workflow run. See PROVENANCE.md for the policy.

          [skip ci]
          EOF
          )"
          # Push with rebase-retry: a docs commit landing on main between our
          # checkout and this push (the 2026-06-11 race) must not strand the
          # refresh — rebase the one-commit refresh onto the new head and
          # retry, a few times, before giving up.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto current main and retrying"
            git pull --rebase origin main
          done
          git push origin main
