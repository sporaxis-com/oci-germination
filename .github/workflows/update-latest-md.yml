name: update-latest-md

# Refresh LATEST.md from GHCR — but ONLY after SLSA Build Provenance v1
# attestations verify against the digests we're about to publish. This is
# the policy gate from PROVENANCE.md Rule 2: if `gh attestation verify`
# doesn't find a workflow-issued attestation, this workflow exits non-zero
# and LATEST.md stays where it was.

on:
  workflow_run:
    workflows:
      - Build OCI Bundles
      - core-pg17-release
      - core-pg17-micro-release
      - core-pg17-nats-release
      - core-pg17-nats-micro-release
      - pg17-pgrdf-release
      - pg17-pgrdf-pgck-release
      - pg17-pgrdf-pgck-nats-release
      - pg18-pgrdf-pgck-nats-micro-release
    types:
      - completed
  # Manual re-trigger for recovery — e.g. when a push race (below) loses, or
  # an operator wants to force a re-render after registry-side changes.
  workflow_dispatch:

permissions:
  contents: write        # commit refreshed LATEST.md back to main
  packages: read         # read GHCR package versions
  attestations: read     # gh attestation verify

concurrency:
  group: update-latest-md
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Render LATEST.md (verify-then-render)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # Opt the renderer into test-confirming composition: for any bundle that
          # opts in (a composition.confirmed.json present) whose committed digest no
          # longer matches the advertised one, stand the freshly-pushed image up,
          # re-probe its native .version() surfaces, and re-stamp the JSON. Best-
          # effort — a flaky probe leaves the committed JSON and falls back to the
          # expected layer map; it never fails the render. See PROVENANCE.md.
          #
          # ⚠ KNOWN LIMIT, measured 2026-09-04. The trigger is "digest CHANGED",
          # so a record that is WRONG but carries the CURRENT digest is invisible
          # to this refresh: re-running the workflow will not repair it, because
          # from here it looks already-current. That is exactly what happened for
          # v0.7.43 and v0.7.44 — a broken probe wrote error strings into the
          # `Confirmed (real)` column with all_match:false, stamped them with the
          # right digest, and then no amount of re-running could correct it.
          # Repairing such a record means regenerating it with
          # tools/version_composition.py --probe and committing the result.
          # A freshness check that only asks "did the subject change" cannot
          # notice that its own last answer was wrong.
          PROBE_COMPOSITION: "1"
        run: |
          set -euo pipefail
          pip install --quiet pyyaml || pip3 install --quiet pyyaml || true
          python3 tools/render-latest-md.py > LATEST.md.new
          mv LATEST.md.new LATEST.md

      - name: Commit refresh if changed
        run: |
          set -euo pipefail
          if git diff --quiet LATEST.md bundles/*/composition.confirmed.json; then
            echo "LATEST.md + composition records already current — nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST.md bundles/*/composition.confirmed.json
          git commit -m "$(cat <<'EOF'
          docs(auto): refresh LATEST.md from GHCR (attestation-gated)

          Generated by .github/workflows/update-latest-md.yml after an upstream
          release workflow reported success AND after SLSA Build Provenance v1
          attestations verified via 'gh attestation verify' for every digest
          this file advertises. Do not edit by hand — manual edits are reverted
          on the next workflow run. See PROVENANCE.md for the policy.

          [skip ci]
          EOF
          )"
          # Push with rebase-retry: a docs commit landing on main between our
          # checkout and this push (the 2026-06-11 race) must not strand the
          # refresh — rebase the one-commit refresh onto the new head and
          # retry, a few times, before giving up.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto current main and retrying"
            git pull --rebase origin main
          done
          git push origin main
