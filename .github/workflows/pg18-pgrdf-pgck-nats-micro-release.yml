name: pg18-pgrdf-pgck-nats-micro-release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - pg18-pgrdf-pgck-nats-micro-v*
  schedule:
    - cron: '59 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # id-token + attestations are required for SLSA Build Provenance v1
  # (PROVENANCE.md Rule 2: no advance into LATEST.md without attestation).
  id-token: write
  attestations: write

concurrency:
  group: pg18-pgrdf-pgck-nats-micro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Run tests
        run: go test ./...

      - name: Regenerate bundle outputs
        run: bash scripts/generate.sh

      - name: Verify generated files are committed
        run: git diff --exit-code -- bundles/

      - name: Lint pgRDF preload contract
        run: bash scripts/lint-pgrdf-preload.sh

      - name: Build native all-in-one NATS micro image
        run: bash scripts/build-pg18-pgrdf-pgck-nats-micro.sh

      - name: Smoke test native all-in-one NATS micro image
        run: bash scripts/smoke-pg18-pgrdf-pgck-nats-micro.sh

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pg18-pgrdf-pgck-nats-micro-v')
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "refusing to publish tag outside origin/main history: $GITHUB_SHA" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate bundle outputs
        run: bash scripts/generate.sh

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve release coordinates
        id: meta
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ociger-pg18-pgrdf-pgck-nats-micro" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#pg18-pgrdf-pgck-nats-micro-}" >> "$GITHUB_OUTPUT"

      - name: Publish multi-arch image
        id: publish
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file bundles/bundle-pg18-pgrdf-pgck-nats-micro/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.tag }}" \
            --label "org.opencontainers.image.description=PostgreSQL 17 micro runtime with pgRDF, pgCK, and colocated NATS core and websocket listeners" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --tag "${{ steps.meta.outputs.image }}:latest" \
            --provenance=false \
            --metadata-file /tmp/build-meta.json \
            --push \
            .
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/build-meta.json)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published manifest digest: ${DIGEST}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      # SLSA Build Provenance v1 attestation — signed by GitHub's Fulcio
      # CA, pushed to GHCR as an OCI referrer alongside the manifest list.
      # PROVENANCE.md Rule 2: no advance into LATEST.md without this passing.
      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attempt to make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ensure-ghcr-public.sh ociger-pg18-pgrdf-pgck-nats-micro

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}` and `${{ steps.meta.outputs.image }}:latest`.

            Local launch:

            ```bash
            docker run --rm -d \
              --name ociger-pg18-pgrdf-pgck-nats-micro \
              -e PGDATA=/var/lib/postgresql/data \
              -v "$PWD/ociger-pg18-pgrdf-pgck-nats-micro-data:/var/lib/postgresql/data" \
              -p 15439:5432 \
              -p 34223:4222 \
              -p 39223:9222 \
              ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ```

            Then:

            ```bash
            psql -h 127.0.0.1 -p 15439 -U postgres -d postgres \
              -c 'CREATE DATABASE ociger_demo;'
            psql -h 127.0.0.1 -p 15439 -U postgres -d ociger_demo \
              -c 'CREATE EXTENSION pgrdf; CREATE EXTENSION pgck CASCADE; SELECT pgrdf.version(); SELECT pgck_version();'
            nc 127.0.0.1 34223 < /dev/null
            nc -zv 127.0.0.1 39223
            ```
