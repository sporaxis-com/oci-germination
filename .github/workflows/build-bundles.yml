name: Build OCI Bundles

on:
  push:
    tags:
      # pg17-pgrdf-pgck-web-cklib retired 2026-05-31 — was FastAPI/Python;
      # superseded by ck-allinone Delta (s6 + busybox httpd, no Python) +
      # pg17-pgrdf-pgck-static-cklib (also Python-free).
      - 'release-pg17-pgrdf-pgck-static-cklib-*'
      - 'release-ck-allinone-*'
      # pgck-bench is the ONLY sanctioned home for Python in the ociger group.
      # Sibling to ck-allinone (not embedded). Never tagged as prod.
      - 'release-pgck-bench-*'
  # Manual re-trigger for a release tag whose push GitHub silently dropped
  # (recover WITHOUT delete+re-push: `gh workflow run build-bundles.yml --ref <tag>`).
  # The build/version is read from github.ref_name, which equals the tag on dispatch.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token + attestations are required for SLSA Build Provenance v1.
    # Per PROVENANCE.md Rule 2, no entry lands in LATEST.md unless
    # gh attestation verify accepts the digest pushed here.
    permissions:
      contents: write        # create the GitHub Release object (Releases tab)
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract bundle name and version
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          # Order matters: longer prefixes first.
          # pg17-pgrdf-pgck-web-cklib was retired 2026-05-31 (deleted bundle).
          if [[ "$TAG" =~ ^release-pg17-pgrdf-pgck-static-cklib-(.*) ]]; then
            echo "bundle=pg17-pgrdf-pgck-static-cklib" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "dockerfile=bundles/bundle-pg17-pgrdf-pgck-static-cklib/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^release-ck-allinone-(.*) ]]; then
            echo "bundle=ck-allinone" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "dockerfile=bundles/bundle-ck-allinone/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^release-pgck-bench-(.*) ]]; then
            echo "bundle=pgck-bench" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "dockerfile=bundles/bundle-pgck-bench/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Tag format not recognized: $TAG"
            exit 1
          fi

      - name: Calculate semantic version
        id: semver
        run: |
          # Two tag shapes are supported:
          #   release-<bundle>-vM.N       → 2-number tag, patch from git describe distance
          #                                 (e.g. v0.1 + 5 commits → v0.1.5)
          #   release-<bundle>-vM.N.K     → 3-number tag, used verbatim
          #                                 (e.g. v0.6.1 → v0.6.1)
          # The 3-number form is preferred for explicit-patch releases when a
          # 2-number+distance scheme would collide with an already-published tag.
          BUNDLE="${{ steps.extract.outputs.bundle }}"
          BASE_VERSION="${{ steps.extract.outputs.base_version }}"

          if [[ "$BASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SEMANTIC_VERSION="$BASE_VERSION"
            echo "tag_shape=3-number" >> $GITHUB_OUTPUT
          else
            DESCRIBE=$(git describe --tags --match "release-${BUNDLE}-*" --always 2>/dev/null || git describe --tags --always)
            if [[ "$DESCRIBE" =~ -([0-9]+)-g[a-f0-9]+ ]]; then
              PATCH="${BASH_REMATCH[1]}"
              SEMANTIC_VERSION="${BASE_VERSION}.${PATCH}"
            else
              SEMANTIC_VERSION="${BASE_VERSION}.0"
            fi
            echo "tag_shape=2-number+distance" >> $GITHUB_OUTPUT
            echo "describe=$DESCRIBE" >> $GITHUB_OUTPUT
          fi

          echo "semantic_version=$SEMANTIC_VERSION" >> $GITHUB_OUTPUT
          echo "Semantic version: $SEMANTIC_VERSION (bundle=$BUNDLE, base=$BASE_VERSION)"

      # GATE-BEFORE-PUSH (since the v0.7.15 incident): build the native-arch
      # image locally FIRST, run every gate (Python-free, smoke) against it,
      # and only then build+push the multi-arch manifest. The previous order
      # (push, then gate) left an unattested :latest on GHCR whenever a gate
      # failed after the push — v0.7.15 shipped that way and had to be
      # superseded. The gha layer cache makes the second build nearly free
      # for the native arch; only the cross-arch half builds after the gates.
      - name: Build native image for gating (no push)
        id: build_local
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.extract.outputs.dockerfile }}
          push: false
          load: true
          tags: |
            ociger-${{ steps.extract.outputs.bundle }}:ci-gate
          build-args: |
            BUNDLE_VERSION=${{ steps.semver.outputs.semantic_version }}
            GIT_SHA=${{ github.sha }}
          # v0.7.31: cache scoped to THIS COMMIT. Previously an unscoped gha
          # cache let a layer built from an EARLIER commit be reused for one
          # arch while the other arch built fresh — i.e. amd64/arm64 binaries
          # could come from different commits, with nothing detecting it.
          # Scoping by github.sha makes cross-commit layer pairing impossible.
          cache-from: type=gha,scope=${{ github.sha }}
          cache-to: type=gha,mode=max,scope=${{ github.sha }}

      # Python-free gate: prod images MUST contain zero python /
      # uvicorn / fastapi / venv hits. pgck-bench is the sole sanctioned
      # home for Python (role=bench) and skips this gate.
      - name: Verify no Python in prod image
        if: ${{ steps.extract.outputs.bundle != 'pgck-bench' }}
        run: |
          set -euo pipefail
          IMAGE="ociger-${{ steps.extract.outputs.bundle }}:ci-gate"
          echo "Checking $IMAGE for Python/FastAPI/uvicorn/venv traces..."
          # busybox find inside the image; image MAY not have its own busybox,
          # so use a sidecar runner.
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            for d in /opt/venv /usr/local/lib/python* /usr/lib/python*; do
              [ -e "$d" ] && { echo "FOUND $d"; exit 1; }
            done
            for n in python python3 uvicorn fastapi; do
              for p in /usr/bin /usr/local/bin /bin; do
                [ -x "$p/$n" ] && { echo "FOUND $p/$n"; exit 1; }
              done
            done
            exit 0
          ' || {
            echo "✗ SPEC v0.4 §4.4 violation: Python/FastAPI/uvicorn/venv trace in prod image"
            exit 1
          }
          echo "✓ image is Python-free"

      # CHECKLIST.NEXT-CK-ALLINONE §D/§E gate: ck-allinone must serve a /
      # landing that exercises a real NATS-WSS round-trip. The smoke runs
      # the published image and proves end-to-end behaviour before the
      # release advances to attestation.
      - name: Smoke test ck-allinone (WSS round-trip)
        if: ${{ steps.extract.outputs.bundle == 'ck-allinone' }}
        run: |
          set -euo pipefail
          IMAGE="ociger-${{ steps.extract.outputs.bundle }}:ci-gate"
          echo "Smoking $IMAGE …"
          bash scripts/smoke-ck-allinone.sh "$IMAGE"

      # v0.7.30 gate (og#19): prove the auth-callout verified path on the SHIPPED
      # artifact. Boots the image with a self-contained test realm (a fresh
      # Ed25519 key plays the OIDC issuer) and asserts verified dispatch seals
      # `by: urn:ckp:participant:<sub>` while anon/forged/foreign-id are denied.
      # Same docker-run+network mechanism the smoke above already uses in CI.
      - name: Verify auth-callout identity path (ck-allinone)
        if: ${{ steps.extract.outputs.bundle == 'ck-allinone' }}
        run: |
          set -euo pipefail
          IMAGE="ociger-${{ steps.extract.outputs.bundle }}:ci-gate"
          echo "Verifying callout on $IMAGE …"
          bash scripts/verify-callout.sh "$IMAGE"

      # All gates green — NOW build + push the multi-arch manifest. The
      # native-arch layers come straight from the gha cache populated by
      # the gating build; only the cross-arch half builds here. A gate
      # failure above means nothing was pushed and :latest never moved.
      - name: Build and push to GHCR (post-gate)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.extract.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          # Each release moves :latest forward on the production image
          # name. Devel-track images (when the -devel image name lands)
          # will move their own :latest independently.
          tags: |
            ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}
            ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:latest
          # BUNDLE_VERSION is consumed by each bundle's Dockerfile final
          # stage to emit an explicit LABEL org.opencontainers.image.version,
          # overriding whatever the parent FROM image advertises. Prevents
          # the bundle from misadvertising its parent's version.
          build-args: |
            BUNDLE_VERSION=${{ steps.semver.outputs.semantic_version }}
            GIT_SHA=${{ github.sha }}
          # Same commit-scoped cache as the gating build (see there) — both
          # arches must derive from THIS commit, never a cached earlier one.
          cache-from: type=gha,scope=${{ github.sha }}
          cache-to: type=gha,mode=max,scope=${{ github.sha }}

      # v0.7.31 cross-arch parity gate. Runs BEFORE attestation, so a divergent
      # build is never attested and never advances LATEST.md. Asserts that every
      # published arch carries (a) the SAME source revision label and (b) the
      # SAME runtime glibc build — the exact pair of properties an external
      # report questioned for v0.7.30. Enforced, not asserted.
      - name: Cross-arch parity gate (same commit, same libc)
        if: ${{ steps.extract.outputs.bundle == 'ck-allinone' }}
        run: |
          set -euo pipefail
          REPO="${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}"
          IMG="$REPO@${{ steps.push.outputs.digest }}"
          rev_ref=""; libc_ref=""; floor_ref=""
          # Resolve each arch's OWN manifest digest from the index, then create by
          # that distinct digest (NOT `docker create --platform` off the shared
          # index digest, which conflicts in the local store: "cannot overwrite
          # digest"). Extraction via docker cp does not execute the image, so a
          # cross-arch manifest on an amd64 runner is fine.
          IDX="$(docker buildx imagetools inspect "$IMG" --raw)"
          for arch in amd64 arm64; do
            tri=$([ "$arch" = amd64 ] && echo x86_64 || echo aarch64)
            adig="$(printf '%s' "$IDX" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(m['digest'] for m in d['manifests'] if m.get('platform',{}).get('architecture')=='$arch'))")"
            ref="$REPO@$adig"
            cid="$(docker create "$ref")"   # pulls the arch image
            rev="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
            docker cp "$cid:/lib/$tri-linux-gnu/libc.so.6" "/tmp/libc-$arch" >/dev/null
            rm -rf "/tmp/lib-$arch"; mkdir -p "/tmp/lib-$arch"
            docker cp "$cid:/usr/lib/postgresql/18/lib/." "/tmp/lib-$arch/" >/dev/null
            docker rm -f "$cid" >/dev/null
            libc="$(strings "/tmp/libc-$arch" | grep -m1 'GNU C Library (Debian GLIBC')"
            # The floor that ACTUALLY matters: the highest GLIBC_* any shipped
            # extension .so requires. v0.7.30 had amd64=2.34 vs arm64=2.39 for
            # pgrdf.so (upstream built its two arches on mismatched bare runners)
            # while revision + runtime libc were identical — so revision/libc
            # checks alone are NOT sufficient. This is the check that catches it.
            floor="$(cat /tmp/lib-$arch/*.so 2>/dev/null | strings | grep -o 'GLIBC_[0-9][0-9.]*' | sort -V | tail -1)"
            echo "  $arch: revision=${rev:-<none>}  ext-glibc-floor=${floor:-<none>}  libc=${libc}"
            [ -n "$rev" ] || { echo "::error::$arch has no org.opencontainers.image.revision label"; exit 1; }
            [ "$rev" = "${{ github.sha }}" ] || { echo "::error::$arch revision $rev != building commit ${{ github.sha }}"; exit 1; }
            if [ -z "$rev_ref" ]; then rev_ref="$rev"; libc_ref="$libc"; floor_ref="$floor"; else
              [ "$rev"   = "$rev_ref"   ] || { echo "::error::arch revision mismatch"; exit 1; }
              [ "$libc"  = "$libc_ref"  ] || { echo "::error::arch libc mismatch: '$libc' != '$libc_ref'"; exit 1; }
              [ "$floor" = "$floor_ref" ] || { echo "::error::EXTENSION GLIBC FLOOR MISMATCH across arches: $floor != $floor_ref — an upstream .so was built on a different base per arch (see CHANGELOG v0.7.31)"; exit 1; }
            fi
          done
          echo "cross-arch parity OK — one commit ($rev_ref), one ext floor ($floor_ref), one libc."

      # SLSA Build Provenance v1 attestation — signed by GitHub's Fulcio
      # CA via the Sigstore keyless flow. The attestation is pushed to
      # GHCR as an OCI referrer alongside the manifest list, so
      # 'gh attestation verify oci://<image>:<tag> --repo sporaxis-com/oci-germination'
      # works for every published bundle. PROVENANCE.md Rule 2: no
      # advance into LATEST.md without this passing.
      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Image digest
        run: |
          echo "Built, pushed, and attested:"
          echo "  Bundle:           ${{ steps.extract.outputs.bundle }}"
          echo "  Base version:     ${{ steps.extract.outputs.base_version }}"
          echo "  Semantic version: ${{ steps.semver.outputs.semantic_version }}"
          echo "  Image:            ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}"
          echo "  Index digest:     ${{ steps.push.outputs.digest }}"
          echo ""
          echo "Verify:"
          echo "  gh attestation verify oci://${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }} \\"
          echo "    --repo sporaxis-com/oci-germination"

      # Publish a GitHub Release for the tag so the repo's Releases tab + the
      # "Latest release" badge reflect the flagship cut. Previously this
      # workflow pushed only the git tag + GHCR package, so ck-allinone
      # releases never appeared on the Releases UI — the badge pointed at an
      # internal pg_base image. Idempotent: edit if the release already exists.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.extract.outputs.bundle }}"
          VER="${{ steps.semver.outputs.semantic_version }}"
          IMG="${{ env.REGISTRY }}/sporaxis-com/ociger-${BUNDLE}:${VER}"
          DIGEST="${{ steps.push.outputs.digest }}"
          NOTES="$(cat <<EOF
          **Image:** \`${IMG}\`
          **Digest:** \`${DIGEST}\`
          **Attestation:** SLSA Build Provenance v1 — \`gh attestation verify oci://${IMG} --repo ${{ github.repository }}\`

          \`\`\`sh
          docker pull ${IMG}
          \`\`\`

          Full entry: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          EOF
          )"
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "ociger-${BUNDLE} ${VER}" --notes "${NOTES}" --latest
          else
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "ociger-${BUNDLE} ${VER}" --notes "${NOTES}" --latest
          fi
