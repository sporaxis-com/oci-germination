name: Build OCI Bundles

on:
  push:
    tags:
      - 'release-pg17-pgrdf-pgck-web-cklib-*'
      - 'release-ck-allinone-*'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract bundle name and version
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^release-pg17-pgrdf-pgck-web-cklib-(.*) ]]; then
            echo "bundle=pg17-pgrdf-pgck-web-cklib" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "context=bundles/bundle-pg17-pgrdf-pgck-web-cklib" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^release-ck-allinone-(.*) ]]; then
            echo "bundle=ck-allinone" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "context=bundles/bundle-ck-allinone" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Tag format not recognized: $TAG"
            exit 1
          fi

      - name: Calculate semantic version
        id: semver
        run: |
          DESCRIBE=$(git describe --tags --always)
          BASE_VERSION="${{ steps.extract.outputs.base_version }}"

          # Extract patch number from git describe (distance since tag)
          # Format: release-ck-allinone-vX.Y-N-gHASH or release-ck-allinone-vX.Y if at tag
          if [[ "$DESCRIBE" =~ -([0-9]+)-g[a-f0-9]+ ]]; then
            PATCH="${BASH_REMATCH[1]}"
            SEMANTIC_VERSION="${BASE_VERSION}.${PATCH}"
          else
            # At the tag (distance 0)
            SEMANTIC_VERSION="${BASE_VERSION}.0"
          fi

          echo "semantic_version=$SEMANTIC_VERSION" >> $GITHUB_OUTPUT
          echo "Semantic version: $SEMANTIC_VERSION from git describe: $DESCRIBE"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.extract.outputs.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Built and pushed:"
          echo "  Bundle: ${{ steps.extract.outputs.bundle }}"
          echo "  Base version: ${{ steps.extract.outputs.base_version }}"
          echo "  Semantic version: ${{ steps.semver.outputs.semantic_version }}"
          echo "  Registry: ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}"
