name: Build OCI Bundles

on:
  push:
    tags:
      # pg17-pgrdf-pgck-web-cklib retired 2026-05-31 — was FastAPI/Python;
      # superseded by ck-allinone Delta (s6 + busybox httpd, no Python) +
      # pg17-pgrdf-pgck-static-cklib (also Python-free).
      - 'release-pg17-pgrdf-pgck-static-cklib-*'
      - 'release-ck-allinone-*'
      # pgck-bench is the ONLY sanctioned home for Python in the ociger group.
      # Sibling to ck-allinone (not embedded). Never tagged as prod.
      - 'release-pgck-bench-*'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token + attestations are required for SLSA Build Provenance v1.
    # Per PROVENANCE.md Rule 2, no entry lands in LATEST.md unless
    # gh attestation verify accepts the digest pushed here.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract bundle name and version
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          # Order matters: longer prefixes first.
          # pg17-pgrdf-pgck-web-cklib was retired 2026-05-31 (deleted bundle).
          if [[ "$TAG" =~ ^release-pg17-pgrdf-pgck-static-cklib-(.*) ]]; then
            echo "bundle=pg17-pgrdf-pgck-static-cklib" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "dockerfile=bundles/bundle-pg17-pgrdf-pgck-static-cklib/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^release-ck-allinone-(.*) ]]; then
            echo "bundle=ck-allinone" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "dockerfile=bundles/bundle-ck-allinone/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^release-pgck-bench-(.*) ]]; then
            echo "bundle=pgck-bench" >> $GITHUB_OUTPUT
            echo "base_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "dockerfile=bundles/bundle-pgck-bench/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Tag format not recognized: $TAG"
            exit 1
          fi

      - name: Calculate semantic version
        id: semver
        run: |
          # Two tag shapes are supported:
          #   release-<bundle>-vM.N       → 2-number tag, patch from git describe distance
          #                                 (e.g. v0.1 + 5 commits → v0.1.5)
          #   release-<bundle>-vM.N.K     → 3-number tag, used verbatim
          #                                 (e.g. v0.6.1 → v0.6.1)
          # The 3-number form is preferred for explicit-patch releases when a
          # 2-number+distance scheme would collide with an already-published tag.
          BUNDLE="${{ steps.extract.outputs.bundle }}"
          BASE_VERSION="${{ steps.extract.outputs.base_version }}"

          if [[ "$BASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SEMANTIC_VERSION="$BASE_VERSION"
            echo "tag_shape=3-number" >> $GITHUB_OUTPUT
          else
            DESCRIBE=$(git describe --tags --match "release-${BUNDLE}-*" --always 2>/dev/null || git describe --tags --always)
            if [[ "$DESCRIBE" =~ -([0-9]+)-g[a-f0-9]+ ]]; then
              PATCH="${BASH_REMATCH[1]}"
              SEMANTIC_VERSION="${BASE_VERSION}.${PATCH}"
            else
              SEMANTIC_VERSION="${BASE_VERSION}.0"
            fi
            echo "tag_shape=2-number+distance" >> $GITHUB_OUTPUT
            echo "describe=$DESCRIBE" >> $GITHUB_OUTPUT
          fi

          echo "semantic_version=$SEMANTIC_VERSION" >> $GITHUB_OUTPUT
          echo "Semantic version: $SEMANTIC_VERSION (bundle=$BUNDLE, base=$BASE_VERSION)"

      - name: Build and push to GHCR
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.extract.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          # Each release moves :latest forward on the production image
          # name. Devel-track images (when the -devel image name lands)
          # will move their own :latest independently.
          tags: |
            ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}
            ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Python-free gate: prod images MUST contain zero python /
      # uvicorn / fastapi / venv hits. pgck-bench is the sole sanctioned
      # home for Python (role=bench) and skips this gate.
      - name: Verify no Python in prod image
        if: ${{ steps.extract.outputs.bundle != 'pgck-bench' }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}"
          echo "Checking $IMAGE for Python/FastAPI/uvicorn/venv traces..."
          # busybox find inside the image; image MAY not have its own busybox,
          # so use a sidecar runner.
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            for d in /opt/venv /usr/local/lib/python* /usr/lib/python*; do
              [ -e "$d" ] && { echo "FOUND $d"; exit 1; }
            done
            for n in python python3 uvicorn fastapi; do
              for p in /usr/bin /usr/local/bin /bin; do
                [ -x "$p/$n" ] && { echo "FOUND $p/$n"; exit 1; }
              done
            done
            exit 0
          ' || {
            echo "✗ SPEC v0.4 §4.4 violation: Python/FastAPI/uvicorn/venv trace in prod image"
            exit 1
          }
          echo "✓ image is Python-free"

      # CHECKLIST.NEXT-CK-ALLINONE §D/§E gate: ck-allinone must serve a /
      # landing that exercises a real NATS-WSS round-trip. The smoke runs
      # the published image and proves end-to-end behaviour before the
      # release advances to attestation.
      - name: Smoke test ck-allinone (WSS round-trip)
        if: ${{ steps.extract.outputs.bundle == 'ck-allinone' }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}"
          echo "Smoking $IMAGE …"
          bash scripts/smoke-ck-allinone.sh "$IMAGE"

      # SLSA Build Provenance v1 attestation — signed by GitHub's Fulcio
      # CA via the Sigstore keyless flow. The attestation is pushed to
      # GHCR as an OCI referrer alongside the manifest list, so
      # 'gh attestation verify oci://<image>:<tag> --repo sporaxis-com/oci-germination'
      # works for every published bundle. PROVENANCE.md Rule 2: no
      # advance into LATEST.md without this passing.
      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Image digest
        run: |
          echo "Built, pushed, and attested:"
          echo "  Bundle:           ${{ steps.extract.outputs.bundle }}"
          echo "  Base version:     ${{ steps.extract.outputs.base_version }}"
          echo "  Semantic version: ${{ steps.semver.outputs.semantic_version }}"
          echo "  Image:            ${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }}"
          echo "  Index digest:     ${{ steps.push.outputs.digest }}"
          echo ""
          echo "Verify:"
          echo "  gh attestation verify oci://${{ env.REGISTRY }}/sporaxis-com/ociger-${{ steps.extract.outputs.bundle }}:${{ steps.semver.outputs.semantic_version }} \\"
          echo "    --repo sporaxis-com/oci-germination"
